<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С Днём милиции, Жора!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .greeting {
            font-size: 1.4rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s, background 0.3s;
        }
        button:hover {
            background-color: #e84118;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>🎉 С Днём милиции! 🎉</h1>
    <div class="greeting">
        <p>Дорогой Жора, поздравляем тебя с профессиональным праздником!</p>
        <p>Спасибо за твою службу, за спокойствие и порядок, которые ты помогаешь сохранять.</p>
        <p>Пусть дежурства будут спокойными, а дома всегда ждут и любят.</p>
    </div>
    <button onclick="alert('С праздником, Жора! Пусть всё будет спокойно!')">Поздравить Жору</button>
</body>
</html>
